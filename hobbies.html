    <p class="page-sub">看球、踢球，和一件由它长出来的作品。</p>

  <section class="hobby">
    <p class="hobby-word">足球</p>
    <div class="hobby-text">
      <p>
        喜欢足球：周末的比赛基本不落，场地约得上也会去踢两脚。
        看得多了，对规则、阵型和球员风格的兴趣，慢慢超过了对比分的兴趣。
      </p>
      <p>
        后来把这份兴趣做成了一个作品——《传奇抽卡》：把自己熟悉的球员做成卡牌，
        301 名球员、367 张卡，抽到谁全看运气，抽到的还能排进首发阵容。
      </p>
    </div>
