<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>计时器</title>
<style>
  :root{
    --ink:#101828;
    --blue:#1b3a8b;
    --blue-dark:#152f70;
    --gray:#667085;
    --muted:#98a2b3;
    --line:#e4e7ec;
    --card:#ffffff;
    --radius:28px;
  }

  *{box-sizing:border-box}

  html,body{height:100%}

  body{
    margin:0;
    min-height:100vh;
    display:grid;
    place-items:center;
    padding:32px 20px;
    background:
      radial-gradient(120% 80% at 50% -10%, #e8f0ff 0%, #f6f9ff 42%, #ffffff 78%);
    color:var(--ink);
    font-family:"Inter","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .card{
    width:min(92vw, 440px);
    padding:44px 38px 38px;
    border-radius:var(--radius);
    background:var(--card);
    border:1px solid rgba(27, 58, 139, .06);
    box-shadow:
      0 2px 8px rgba(16, 24, 40, .04),
      0 28px 60px -28px rgba(27, 58, 139, .28);
    text-align:center;
  }

  .kicker{
    margin:0;
    font-size:11px;
    letter-spacing:.28em;
    color:var(--muted);
    text-transform:uppercase;
  }

  .time{
    margin:18px 0 0;
    font-size:clamp(44px, 11vw, 66px);
    font-weight:600;
    line-height:1.1;
    letter-spacing:.03em;
    color:var(--blue);
    font-variant-numeric:tabular-nums;
    font-feature-settings:"tnum" 1;
  }

  .state{
    margin:10px 0 0;
    font-size:13px;
    letter-spacing:.08em;
    color:var(--gray);
    transition:color .25s ease;
  }
  .state.is-running{ color:#12805c; }
  .state.is-paused{ color:#b54708; }

  .actions{
    display:flex;
    gap:10px;
    margin-top:30px;
  }

  .btn{
    flex:1;
    padding:12px 10px;
    border:1px solid var(--line);
    border-radius:12px;
    background:#fff;
    color:#475467;
    font:inherit;
    font-size:14px;
    letter-spacing:.04em;
    cursor:pointer;
    transition:color .2s ease, border-color .2s ease, background-color .2s ease;
  }
  .btn:hover:not(:disabled){ color:var(--blue); border-color:var(--blue); }
  .btn:active:not(:disabled){ transform:translateY(1px); }

  .btn.primary{
    background:var(--blue);
    border-color:var(--blue);
    color:#fff;
  }
  .btn.primary:hover:not(:disabled){ background:var(--blue-dark); border-color:var(--blue-dark); color:#fff; }

  .btn:disabled{ opacity:.4; cursor:not-allowed; }

  .btn:focus-visible{ outline:2px solid var(--blue); outline-offset:2px; }

  .hint{
    margin:22px 0 0;
    font-size:11.5px;
    color:var(--muted);
    letter-spacing:.02em;
  }

  @media (max-width:420px){
    .card{ padding:34px 22px 28px; border-radius:22px; }
    .actions{ gap:8px; }
    .btn{ font-size:13px; padding:11px 8px; }
  }
</style>
</head>
<body>

<main class="card">
  <p class="kicker">Timer</p>
  <h1 class="time" id="time" aria-live="off">00:00:00</h1>
  <p class="state" id="state">准备就绪</p>

  <div class="actions">
    <button class="btn primary" id="startBtn" type="button">开始</button>
    <button class="btn" id="pauseBtn" type="button" disabled>暂停</button>
    <button class="btn" id="resetBtn" type="button">重置</button>
  </div>

  <p class="hint">按开始计时，暂停后可以继续</p>
</main>

<script>
(function () {
  "use strict";

  var timeEl = document.getElementById("time");
  var stateEl = document.getElementById("state");
  var startBtn = document.getElementById("startBtn");
  var pauseBtn = document.getElementById("pauseBtn");
  var resetBtn = document.getElementById("resetBtn");

  var elapsed = 0;        // 已经累计的毫秒
  var startedAt = 0;      // 本次开始的时刻
  var running = false;
  var frame = null;

  function pad(n) { return n < 10 ? "0" + n : String(n); }

  function format(ms) {
    var total = Math.floor(ms / 1000);
    var h = Math.floor(total / 3600);
    var m = Math.floor((total % 3600) / 60);
    var s = total % 60;
    return pad(h) + ":" + pad(m) + ":" + pad(s);
  }

  function current() {
    return elapsed + (running ? performance.now() - startedAt : 0);
  }

  function paint() {
    timeEl.textContent = format(current());
  }

  function loop() {
    paint();
    frame = window.requestAnimationFrame(loop);
  }

  function sync() {
    startBtn.disabled = running;
    pauseBtn.disabled = !running;
    startBtn.textContent = (!running && elapsed > 0) ? "继续" : "开始";
    stateEl.classList.toggle("is-running", running);
    stateEl.classList.toggle("is-paused", !running && elapsed > 0);
    stateEl.textContent = running ? "计时中" : (elapsed > 0 ? "已暂停" : "准备就绪");
  }

  function start() {
    if (running) return;
    startedAt = performance.now();
    running = true;
    sync();
    loop();
  }

  function pause() {
    if (!running) return;
    elapsed += performance.now() - startedAt;
    running = false;
    if (frame) window.cancelAnimationFrame(frame);
    frame = null;
    paint();
    sync();
  }

  function reset() {
    running = false;
    if (frame) window.cancelAnimationFrame(frame);
    frame = null;
    elapsed = 0;
    startedAt = 0;
    paint();
    sync();
  }

  startBtn.addEventListener("click", start);
  pauseBtn.addEventListener("click", pause);
  resetBtn.addEventListener("click", reset);

  paint();
  sync();
})();
</script>
</body>
</html>
